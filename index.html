    body {
      background: transparent;

      overflow: hidden;
      color: #fff;
    }

    .ticker-bar {
      width: 100vw;
      height: 40px;
      background: rgba(14, 28, 24, 0.95);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      border-top: 2px solid #b83b28;
      border-bottom: 2px solid #b83b28;
    }

    .ticker-header {
      background: rgba(8, 18, 15, 0.9);
      color: #e2a84b;
      font-weight: 900;
      font-size: 11px;
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      z-index: 10;
      border-right: 1px solid rgba(226, 168, 75, 0.3);
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.5);
    }

    .header-icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .ticker-track-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
    }

    .ticker-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: ticker-scroll 80s linear infinite;
    }

    .ticker-track:hover {
      animation-play-state: paused;
    }

    @keyframes ticker-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .t-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      margin: 0 35px;
      border-radius: 6px;
      background: rgba(22, 42, 36, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    .t-spacer {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 20px;
    }

    .t-spacer img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
