<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ßr Shiny Wars Ticker - Meme Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .ticker-bar {
      width: 100vw;
      height: 40px;
      background: rgba(28, 22, 64, 0.95);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      border-top: 2px solid transparent;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de) 1;
    }

    .ticker-header {
      background: rgba(18, 14, 42, 0.85);
      color: #ffcc33;
      font-weight: 900;
      font-size: 11px;
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      z-index: 10;
      border-right: 1px solid rgba(255, 204, 51, 0.3);
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.5);
    }

    .ticker-track-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
    }

    .ticker-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: ticker-scroll 80s linear infinite;
    }

    .ticker-track:hover {
      animation-play-state: paused;
    }

    @keyframes ticker-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Message Item Styling */
    .t-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      margin: 0 45px; /* Large gap between messages */
      border-radius: 6px;
      background: rgba(45, 36, 90, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    /* Spacer Break Between Jokes */
    .t-spacer {
      display: inline-flex;
      align-items: center;
      margin: 0 30px;
      color: rgba(255, 204, 51, 0.5);
      font-size: 12px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

  <div class="ticker-bar" id="ticker-bar">
    <div class="ticker-header" id="header-box">
      ✨ <span id="header-text">SHINY WARS INSIGHTS</span>
    </div>
    <div class="ticker-track-wrap">
      <div class="ticker-track" id="ticker-content"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ EASY CUSTOMIZATION CONFIG - EDIT MESSAGES & COLORS HERE
    // =========================================================================
    const CONFIG = {
      HEADER_TITLE: "TURTLE CUM",
      
      // Color palette used to cycle through messages
      COLORS: [
        "#ffcc33", // Supa Gold
        "#ff3399", // Neon Pink
        "#00e5ff", // Electric Cyan
        "#33ff77", // Bright Green
        "#ff9933", // Vibrant Orange
        "#cc66ff"  // Purple Star
      ],

      // Your custom list of joke messages
      JOKE_MESSAGES: [
        "any spots? 闪光时刻祝福降临",
        "who's got an who's got an unbusy? 五个猎人同一分钟?",
        "link open wide today 今天天空大开",
        "better odds smile upon us 财神向下微笑",
        "In 2007 RockLogster was reportedly seen teaching a group of pigeons basic accounting. The pigeons were later audited.",
        "shiny hour blessing arrive 闪光时刻祝福降临",
        "five hunter same minute 五个猎人同一分钟",
        "heaven open wide today 今天天空大开",
        "fortune god smile down 财神向下微笑",
        "In 2023 iSilver was arrested for impersonating a parking attendant. He collected $84.",
        "many ditto make sex 很多百变怪在生蛋",
        "too many egg for boxes 盒子蛋多装不下了",
        "no rare flash yet 至今还没出稀有闪",
        "we make more ditto do sex 叫更多百变怪继续生"
      ]
    };
    // =========================================================================

    document.getElementById("header-text").innerText = CONFIG.HEADER_TITLE;

    function renderJokeCard(message, index) {
      // Pick a color from the palette array based on index
      const color = CONFIG.COLORS[index % CONFIG.COLORS.length];

      return `
        <div class="t-item" style="border-color: ${color}88; color: ${color};">
          <span>${message}</span>
        </div>
        <div class="t-spacer">✨ ✨ ✨</div>
      `;
    }

    function initTicker() {
      const container = document.getElementById('ticker-content');
      
      // Build cards for each message
      const markup = CONFIG.JOKE_MESSAGES.map((msg, idx) => renderJokeCard(msg, idx)).join('');
      
      // Duplicate sequence to allow seamless infinite loop
      container.innerHTML = markup + markup;

      // Calculate smooth scroll timing based on total content width
      const totalWidth = container.scrollWidth / 2;
      const scrollSpeed = Math.max(30, Math.round(totalWidth / 60));
      container.style.animationDuration = `${scrollSpeed}s`;
    }

    initTicker();
  </script>
</body>
</html>
